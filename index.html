<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>민컴퍼니 성과급 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: blue header card holds title + period controls; pill tabs below; white table panels on a cool blue-grey ground */
:root{
  --bg:#f2f5fa; --surface:#ffffff; --sunk:#edf2f9; --line:#d3ddeb; --line-soft:#e4ebf4;
  --ink:#13203a; --ink-2:#3a4b69; --ink-3:#64789a;
  --accent:#1d5fd0; --accent-ink:#ffffff; --accent-soft:#e5eefc; --accent-line:#b9cff4;
  --band:#1a4ea8; --band-2:#2563c9; --band-ink:#ffffff; --band-ink-2:#cfe0ff;
  --edit:#f7faff;
  --good:#1d8456; --good-soft:#e1f3ea; --warn:#b06d12; --warn-soft:#fcf0dc; --bad:#c03a26; --bad-soft:#fbe5e1;
  --lock:#1d5fd0; --lock-soft:#e5eefc;
  --f-body:"Nunito","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Nunito","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1423; --surface:#131e33; --sunk:#0f192c; --line:#253553; --line-soft:#1c2a44;
  --ink:#e8eefa; --ink-2:#b5c4df; --ink-3:#8496b6;
  --accent:#6fa3ff; --accent-ink:#0a1530; --accent-soft:#18294a; --accent-line:#2c4a80;
  --band:#15336d; --band-2:#1c4590; --band-ink:#ffffff; --band-ink-2:#a9c4f5;
  --edit:#0f1a2f;
  --good:#5fca95; --good-soft:#14301f; --warn:#e7ad59; --warn-soft:#352812; --bad:#f08b78; --bad-soft:#3b1d18;
  --lock:#6fa3ff; --lock-soft:#18294a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1423; --surface:#131e33; --sunk:#0f192c; --line:#253553; --line-soft:#1c2a44;
  --ink:#e8eefa; --ink-2:#b5c4df; --ink-3:#8496b6;
  --accent:#6fa3ff; --accent-ink:#0a1530; --accent-soft:#18294a; --accent-line:#2c4a80;
  --band:#15336d; --band-2:#1c4590; --band-ink:#ffffff; --band-ink-2:#a9c4f5;
  --edit:#0f1a2f;
  --good:#5fca95; --good-soft:#14301f; --warn:#e7ad59; --warn-soft:#352812; --bad:#f08b78; --bad-soft:#3b1d18;
  --lock:#6fa3ff; --lock-soft:#18294a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;font-feature-settings:"tnum" 1;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:23px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700;color:var(--ink-2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.05em;color:var(--ink-3);font-weight:600}

header.top{background:linear-gradient(135deg,var(--band),var(--band-2));color:var(--band-ink);border-radius:14px;padding:20px 22px;
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
header.top .eyebrow{color:var(--band-ink-2)}
header.top .periodbar label{color:var(--band-ink-2)!important}
header.top select{border-color:transparent}
header.top button.ghost{color:var(--band-ink);border-color:rgba(255,255,255,.35)}
header.top button.ghost:hover{background:rgba(255,255,255,.14)}
header.top .newp{background:rgba(255,255,255,.12)}
header.top button.xl{background:#ffffff;color:#1a4ea8;border-color:#ffffff}
header.top button.xl:hover{background:#e8f0ff;color:#1a4ea8}
header.top .newp button:not(.primary):not(.ghost){background:#ffffff;color:#1a4ea8;border-color:#ffffff}
header.top .newp button.primary{background:#0f2f6b;border-color:#0f2f6b;color:#fff}
header.top .pill.example{background:rgba(255,255,255,.16);color:var(--band-ink);border-color:rgba(255,255,255,.4)}
header.top .pill.draft{background:#fff3dc;color:#8a5208}
header.top .pill.locked{background:#ffffff;color:#1a4ea8}
.brand{display:flex;flex-direction:column;gap:2px}
.periodbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
select,input,button{font:inherit;color:inherit}
select,input[type=text]{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
input[type=text]{background:var(--edit);border-color:var(--accent-line)}
input[type=text]:hover:not([disabled]){border-color:var(--accent)}
input[type=text].cell{width:100%;min-width:140px;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14.5px}
input[type=text].name{text-align:left;font-family:var(--f-body)}
input::placeholder{color:var(--ink-3);opacity:.8}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent)}
input[disabled],select[disabled]{background:var(--sunk);color:var(--ink-2);border-color:var(--line-soft)}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;min-height:38px;font-weight:600;color:var(--ink)}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
button.danger:hover{color:var(--bad);border-color:var(--bad)}
button.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
button.ghost:hover{background:var(--accent-soft);color:var(--accent)}
button[disabled]{opacity:.45;cursor:not-allowed}
a{color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.locked{background:var(--lock-soft);color:var(--lock)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.example{background:var(--sunk);color:var(--ink-2);border:1px dashed var(--line);font-weight:600}

nav.tabs{display:flex;gap:6px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
nav.tabs a{flex:1;text-align:center;padding:10px 14px;color:var(--ink-2);text-decoration:none;font-weight:700;border-radius:8px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs a[aria-current="page"] .step{color:var(--accent-ink);background:rgba(255,255,255,.22)}
nav.tabs a:not([aria-current="page"]):hover{background:var(--accent-soft);color:var(--accent)}
nav.tabs .step{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--f-num);font-size:11.5px;margin-right:8px;vertical-align:1px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:0 1px 2px rgba(20,40,80,.04)}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.notice{border-radius:10px;padding:12px 16px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border:1px solid transparent}
.notice.info{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.notice.lock{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.notice.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink)}
.notice .actions{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .eyebrow{color:var(--accent)}
.kpi .v{font-family:var(--f-num);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:var(--ink);line-height:1.25}
.kpi .s{font-size:13px;color:var(--ink-3)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpis{grid-template-columns:minmax(0,1fr)}}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line-soft);text-align:right;vertical-align:middle;white-space:nowrap}
th{font-size:13px;font-weight:700;color:var(--ink-2);background:var(--sunk);border-bottom:1px solid var(--line)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.total td{font-weight:700;border-top:2px solid var(--accent-line);border-bottom:none;background:var(--accent-soft)!important;color:var(--ink)}
tr.sub td{color:var(--ink-2);font-size:13.5px;padding-top:6px;padding-bottom:6px;background:var(--sunk)}
td.hl{background:var(--accent-soft)!important;font-weight:700;color:var(--accent)}
.team-name{font-weight:700}
.team-meta{font-size:12.5px;color:var(--ink-3)}
table.bridge{max-width:680px}
.part td{background:color-mix(in srgb,var(--sunk) 60%,var(--surface));padding-top:6px;padding-bottom:6px}
.part-name{padding-left:18px;position:relative;color:var(--ink-2);font-weight:600}
.part-name::before{content:"";position:absolute;left:6px;top:-6px;width:8px;height:14px;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.login{max-width:560px;margin:24px auto 0}
.login-row{display:flex;gap:8px;flex-wrap:wrap}
.login-row input{flex:1;min-width:220px;background:var(--surface)}
.who-chip{color:var(--band-ink-2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct-in{display:flex;align-items:center;gap:6px}
.pct-in input{min-width:80px!important;max-width:110px}
.pct-in span{color:var(--ink-2)}
.team-toggle{all:unset;cursor:pointer;display:flex;gap:8px;align-items:flex-start;border-radius:6px;padding:2px 4px;margin:-2px -4px}
.team-toggle:hover .team-name{color:var(--accent)}
.team-toggle:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.team-toggle .chev{color:var(--accent);font-size:12px;margin-top:3px;width:10px}
.team-toggle .team-meta{display:block}
tr.plan-open td{background:var(--accent-soft)}
tr.plan-row > td{background:var(--sunk)!important;padding:14px;white-space:normal}
.plan-wrap{display:flex;flex-direction:column;gap:14px}
.plan-summary{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;font-size:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--accent-line);border-radius:10px}
.plan-result{color:var(--accent)}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.plan-grid{grid-template-columns:minmax(0,1fr)}}
.plan-block{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:12px}
.plan-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.plan-tbl input.cell{min-width:90px}
.plan-tbl input.cell.name{min-width:120px}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.chart-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:10px;padding:10px 8px 2px;background:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.seg + .chart-wrap{margin-top:-4px}
tr.bsum td{font-weight:700;background:var(--accent-soft)!important}

.bar{position:relative;height:8px;background:var(--line-soft);border-radius:4px;min-width:96px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);opacity:.6}
.rate{display:flex;flex-direction:column;gap:5px;align-items:flex-end;font-weight:600}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline input{width:120px;text-align:right;font-family:var(--f-num)}
.inline span{color:var(--ink-2);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}

.seg{display:inline-flex;padding:4px;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;flex-wrap:wrap;align-self:flex-start}
.seg button{border:none;border-radius:7px;background:transparent;min-height:36px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="false"]:hover{background:var(--surface)}

.slider{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;background:var(--sunk);border-radius:10px}
.slider label{font-weight:700;color:var(--ink-2)!important}
.slider input[type=range]{flex:1;min-width:180px;accent-color:var(--accent)}
.slider .big{font-family:var(--f-num);font-size:23px;font-weight:700;min-width:76px;text-align:right;color:var(--accent)}

.formula{background:var(--sunk);border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.85;color:var(--ink-2)}
.formula b{color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.person .amt{font-family:var(--f-num);font-size:21px;font-weight:700;color:var(--accent)}
.person .who{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-3)}

.newp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:var(--sunk);border-radius:10px}
.foot{font-size:13px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.saving{font-size:13px;color:var(--ink-3)}
@media (max-width:560px){header.top{padding:16px} .panel{padding:16px} h1{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s ease} button,nav.tabs a{transition:background-color .15s,color .15s}}
</style>
</head>
<body>


<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">민컴퍼니 · 인사</span>
      <h1>팀별 성과급 시뮬레이터</h1>
    </div>
    <div class="periodbar" id="periodbar"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="화면 선택"></nav>
  <div id="notice"></div>
  <main id="view" style="display:flex;flex-direction:column;gap:20px"><div class="panel"><p class="muted">불러오는 중…</p></div></main>
  <div class="foot"><span id="savestate" class="saving"></span><span>금액은 모두 원 단위입니다. TF팀·경영총괄팀은 성과급 대상이 아니며 비용만 전사 영업이익에서 뺍니다. </span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>

(function(){
"use strict";
/* ---------- defaults ---------- */
const DEFAULT_CONFIG = {
  teams:[
    {id:"pro",  name:"전문직마케팅팀", members:[{name:"팀장",role:"팀장",share:60},{name:"팀원",role:"팀원",share:40}]},
    {id:"food", name:"요식업마케팅팀", members:[{name:"팀장",role:"팀장",share:60},{name:"팀원",role:"팀원",share:40}]},
    {id:"viral",name:"바이럴마케팅팀", members:[{name:"담당자",role:"팀원",share:100}]},
    {id:"comm", name:"커머스마케팅팀", members:[{name:"담당자",role:"팀원",share:100}],
      parts:[{id:"commerce",name:"커머스"},{id:"annet",name:"아넷트"},{id:"glamwell",name:"글램웰"}]}
  ],
  overheads:[
    {id:"tf",     name:"TF팀",          note:"성과급 제외 · 비용만 반영"},
    {id:"mgmt",   name:"경영총괄팀",     note:"성과급 제외 · 비용만 반영"},
    {id:"sales",  name:"영업팀",         note:"성과급 제외 · 비용만 반영"},
    {id:"exec",   name:"대표이사및임원", note:"성과급 제외 · 비용만 반영"},
    {id:"common", name:"공동경비",       note:"팀 배분 후 남은 공동 비용"}
  ],
  rule:{
    mode:"tier",            // tier | excess
    wRev:40, wProfit:60,
    poolRate:10,
    tiers:[{min:0,mult:0},{min:100,mult:100}],
    requireBoth:true,          // 매출·영업이익 모두 100% 이상이어야 지급
    gate:100, base:1000000, excessRate:20,
    capRate:30,             // 팀 성과급 상한 = 팀 영업이익의 %
    coMode:"gate",          // none | gate | scale
    coGate:80,              // 전사 영업이익 달성률 기준
    coCapRate:30            // 성과급 총액 상한 = 전사 영업이익의 %
  }
};
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
let config = clone(DEFAULT_CONFIG);
let periods = {};
let currentId = null;
let tab = "plan";
let canWrite = true;
let db = null, mode = "loading";
let simPct = 100, simCost = 100;
let pendingConfirm = null;
let showNew = false;
let dl = null, showExport = false, exportMsg = "";

/* ---------- format ---------- */
const nf = new Intl.NumberFormat("ko-KR",{maximumFractionDigits:0});
function man(v){ if(v==null||isNaN(v)) return "–"; const r=Math.round(v); return (r<0?"−":"")+nf.format(Math.abs(r))+"원"; }
function won(v){ if(v==null||isNaN(v)) return "–"; return nf.format(Math.floor(v))+"원"; }
function shortWon(v){ const a=Math.abs(v), sg=v<0?"−":""; if(a>=1e8) return sg+(Math.round(a/1e7)/10)+"억"; if(a>=1e4) return sg+nf.format(Math.round(a/1e4))+"만"; return sg+nf.format(Math.round(a)); }
function pct(v,d=1){ if(v==null||!isFinite(v)) return "–"; return v.toFixed(d)+"%"; }
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseNum = s => { if(s==null) return null; const t=String(s).replace(/[^\d.\-]/g,""); if(t===""||t==="-") return null; const n=Number(t); return isFinite(n)?n:null; };
const fmtInput = v => v==null? "" : nf.format(v);
const sgn = v => (v>0?"+":"")+nf.format(Math.round(v));

/* ---------- calculation ---------- */
function calc(rule, target, actual){
  const out = {revRate:null, profRate:null, score:null, mult:null, pool:0, capped:false, reason:""};
  if(!target || !actual) return out;
  const tr=target.rev, tp=target.profit, ar=actual.rev, ap=actual.profit;
  if(tr>0 && ar!=null) out.revRate = ar/tr*100;
  if(tp>0 && ap!=null) out.profRate = ap/tp*100;
  if(out.revRate==null || out.profRate==null){ out.reason="입력 필요"; return out; }
  const wsum = (rule.wRev||0)+(rule.wProfit||0) || 1;
  out.score = (out.revRate*(rule.wRev||0) + out.profRate*(rule.wProfit||0))/wsum;
  if(ap<=0){ out.reason="팀 영업이익 적자"; out.mult=0; return out; }
  let pool=0;
  if(rule.mode==="excess"){
    if(out.profRate >= (rule.gate||100)){ pool = (rule.base||0) + Math.max(0, ap-tp)*(rule.excessRate||0)/100; out.mult = 100; }
    else { out.mult=0; out.reason="영업이익 기준 미달"; }
  } else {
    const tiers=[...(rule.tiers||[])].sort((a,b)=>a.min-b.min);
    let m=0; for(const t of tiers){ if(out.score>=t.min) m=t.mult; }
    if(rule.requireBoth && (out.revRate<100 || out.profRate<100)){ m=0; out.reason = out.revRate<100 && out.profRate<100 ? "매출·영업이익 목표 미달" : out.revRate<100 ? "매출 목표 미달" : "영업이익 목표 미달"; }
    out.mult=m; pool = ap*(rule.poolRate||0)/100*m/100;
    if(m===0 && !out.reason) out.reason="목표 미달";
  }
  const cap = ap*(rule.capRate||0)/100;
  if(rule.capRate>0 && pool>cap){ pool=cap; out.capped=true; }
  out.pool = Math.max(0,pool);
  return out;
}
/* 전사 계산: 팀 영업이익 합계 − 공통비 = 전사 영업이익 → 전사 지급 조건·상한 적용 */
function calcCompany(rule, teams, ohs, T, A, C, CA, OR){
  const rows = teams.map(t=>{ const tg=T[t.id]||{}, ac=A[t.id]||{}; return {t,tg,ac,r:calc(rule,tg,ac)}; });
  const sum=(arr,f)=>arr.reduce((s,x)=>s+(Number(f(x))||0),0);
  const teamComplete = rows.every(x=>x.ac.rev!=null && x.ac.profit!=null);
  const costComplete = ohs.every(o=>CA[o.id]!=null);
  const complete = teamComplete && costComplete;
  const tgRev=sum(rows,x=>x.tg.rev), acRev=sum(rows,x=>x.ac.rev);
  const tgTeamP=sum(rows,x=>x.tg.profit), acTeamP=sum(rows,x=>x.ac.profit);
  const tgCost=sum(ohs,o=>C[o.id]), acCost=sum(ohs,o=>CA[o.id]);
  const coTarget=tgTeamP-tgCost, coActual=acTeamP-acCost;
  const coRate = coTarget>0 ? coActual/coTarget*100 : null;
  const rawPool=sum(rows,x=>x.r.pool);
  let factor=1; const notes=[];
  if(complete && rawPool>0){
    if(coActual<=0){ factor=0; notes.push("전사 영업이익 적자로 전원 미지급"); }
    else{
      if(rule.coMode==="gate" && coRate!=null && coRate<(rule.coGate||0)){ factor=0; notes.push(`전사 영업이익 달성률 ${pct(coRate)}로 기준 ${rule.coGate}% 미달 → 전원 미지급`); }
      else if(rule.coMode==="scale" && coRate!=null && coRate<100){ factor=Math.max(0,coRate/100); notes.push(`전사 영업이익 달성률 ${pct(coRate)}만큼 비례 지급`); }
      const cap=coActual*(rule.coCapRate||0)/100;
      if(rule.coCapRate>0 && rawPool*factor>cap){ factor=cap/rawPool; notes.push(`성과급 총액이 전사 영업이익의 ${rule.coCapRate}% 상한에 걸려 비율 조정`); }
    }
  }
  rows.forEach(x=>{ x.pool = x.r.pool*factor; });
  const pool=rawPool*factor;
  const ohRev = Object.values(OR||{}).reduce((t,v)=>t+(Number(v)||0),0);
  return {ohRev, allRev: acRev+ohRev, rows, complete, teamComplete, costComplete, tgRev, acRev, tgTeamP, acTeamP, tgCost, acCost, coTarget, coActual, coRate, rawPool, pool, factor, notes, after:coActual-pool};
}
function simCompany(rule, teams, ohs, T, C, s, cs){
  const A={}, CA={};
  teams.forEach(t=>{ const tg=T[t.id]||{}; A[t.id]={rev:(tg.rev||0)*s/100, profit:(tg.profit||0)*s/100}; });
  ohs.forEach(o=>{ CA[o.id]=(C[o.id]||0)*cs/100; });
  return calcCompany(rule, teams, ohs, T, A, C, CA);
}
function split(team, pool){
  const tot = team.members.reduce((s,m)=>s+(Number(m.share)||0),0) || 1;
  return team.members.map(m=>({...m, amt: pool*(Number(m.share)||0)/tot}));
}
function rateClass(r){ if(r==null) return ""; return r>=100?"good":(r>=80?"warn":"bad"); }
function costClass(r){ if(r==null) return ""; return r<=100?"good":(r<=110?"warn":"bad"); }

/* ---------- persistence ---------- */
const saveTimers = {}; let saving=0; let lastErr="";
const writing = {}; const dirty = {};
function setSaveState(){
  const el=document.getElementById("savestate");
  if(lastErr) el.textContent=lastErr;
  else el.textContent = saving? "저장 중…" : (mode==="db"?"모든 변경 사항이 저장되었습니다.":"");
}
function queueSave(key){ dirty[key]=true; clearTimeout(saveTimers[key]); saveTimers[key]=setTimeout(()=>flush(key),600); }
async function flush(key){
  if(writing[key]){ saveTimers[key]=setTimeout(()=>flush(key),300); return; }
  writing[key]=true; dirty[key]=false; saving++; setSaveState();
  try{
    let res;
    const viaPw = access!=="admin" && viewPw;
    if(key==="config") res = viaPw ? await supa.rpc("pw_save_config",{pw:viewPw, payload:clone(config)}) : await supa.from("config").upsert({id:"main", data:clone(config)});
    else if(periods[key]) res = viaPw ? await supa.rpc("pw_save_period",{pw:viewPw, period_id:key, payload:clone(periods[key])}) : await supa.from("periods").upsert({id:key, data:clone(periods[key])});
    if(res && res.error) throw res.error;
    lastErr="";
  }catch(e){
    const denied = e && (e.code==="42501" || /row-level security|permission|invalid_password/i.test(e.message||""));
    lastErr = denied ? "저장 권한이 없습니다. 보기 전용으로 전환합니다." : "저장하지 못했습니다. 잠시 후 다시 입력해 주세요.";
    if(denied){ canWrite=false; render(); }
  }finally{ writing[key]=false; saving--; setSaveState(); }
}
function localSave(){ try{ localStorage.setItem("mincomp-incentive", JSON.stringify({config,periods})); }catch(e){} }
function localLoad(){ try{ const s=JSON.parse(localStorage.getItem("mincomp-incentive")||"null"); if(s){ applyConfig(s.config||{}); periods=s.periods||{}; Object.values(periods).forEach(normalizePeriod); } }catch(e){} }
function applyConfig(d){
  const c = Object.assign(clone(DEFAULT_CONFIG), clone(d));
  c.rule = Object.assign(clone(DEFAULT_CONFIG.rule), clone(d.rule||{}));
  if(!Array.isArray(c.overheads)) c.overheads = clone(DEFAULT_CONFIG.overheads);
  c.teams.forEach(t=>{ const dt=DEFAULT_CONFIG.teams.find(x=>x.id===t.id); if(dt&&dt.parts&&!t.parts) t.parts=clone(dt.parts); });
  if(c.unit!=="won"){ if(typeof c.rule.base==="number" && c.rule.base<100000) c.rule.base*=10000; c.unit="won"; }
  config = c;
}

/* ---------- 단위 이전: 예전 만원 단위 데이터를 원으로 ---------- */
function scaleObj(o, fields){ if(!o) return; Object.values(o).forEach(v=>{ if(!v||typeof v!=="object") return; fields.forEach(f=>{ if(typeof v[f]==="number") v[f]=v[f]*10000; }); if(v.parts) scaleObj(v.parts, ["rev","cost","profit"]); }); }
function scaleMap(o){ if(!o) return; Object.keys(o).forEach(k=>{ if(typeof o[k]==="number") o[k]=o[k]*10000; }); }
function normalizePeriod(p){
  if(!p || p.unit==="won") return p;
  scaleObj(p.targets,["rev","profit"]); scaleMap(p.costs); scaleObj(p.actuals,["rev","profit"]); scaleMap(p.costActuals);
  [p.confirmed, p.lastConfirmed].forEach(c=>{ if(!c) return; scaleObj(c.targets,["rev","profit"]); scaleMap(c.costs); if(c.rule&&typeof c.rule.base==="number") c.rule.base*=10000; });
  p.unit="won"; return p;
}
/* ---------- periods ---------- */
function sortedPeriods(){ return Object.entries(periods).sort((a,b)=>(b[1].sortKey||"").localeCompare(a[1].sortKey||"")); }
function cur(){ return currentId && periods[currentId] ? periods[currentId] : null; }
function ensureCurrent(){ if(!cur()){ const list=sortedPeriods(); currentId = list.length? list[0][0] : null; } }
function makePeriod(type, year, n){
  let id, label, sk;
  if(type==="M"){ id=`${year}-M${String(n).padStart(2,"0")}`; label=`${year}년 ${n}월`; sk=`${year}-${String(n).padStart(2,"0")}-1`; }
  else if(type==="Q"){ id=`${year}-Q${n}`; label=`${year}년 ${n}분기`; sk=`${year}-${String(n*3).padStart(2,"0")}-2`; }
  else if(type==="H"){ id=`${year}-H${n}`; label=`${year}년 ${n===1?"상":"하"}반기`; sk=`${year}-${String(n*6).padStart(2,"0")}-3`; }
  else { id=`${year}-Y`; label=`${year}년 연간`; sk=`${year}-12-4`; }
  return {id, doc:{label, sortKey:sk, unit:"won", status:"draft", targets:{}, costs:{}, actuals:{}, costActuals:{}, createdAt:new Date().toISOString()}};
}
const isLocked = p => p.status==="confirmed" && p.confirmed;
function teamsFor(p){ return isLocked(p) ? p.confirmed.teams : config.teams; }
function ohsFor(p){ return isLocked(p) ? (p.confirmed.overheads||[]) : config.overheads; }
function ruleFor(p){ return isLocked(p) ? Object.assign(clone(DEFAULT_CONFIG.rule),{coMode:"none"},p.confirmed.rule) : config.rule; }
function targetsFor(p){ return isLocked(p) ? p.confirmed.targets : (p.targets||{}); }
function costsFor(p){ return isLocked(p) ? (p.confirmed.costs||{}) : (p.costs||{}); }

/* ---------- render helpers ---------- */
function bar(rate, inverse){
  const r = rate==null?0:Math.max(0,Math.min(rate,150));
  const cls = inverse? costClass(rate) : rateClass(rate);
  const c = rate==null? "var(--line)" : ({good:"var(--good)",warn:"var(--warn)",bad:"var(--bad)"}[cls]);
  return `<div class="bar" aria-hidden="true"><i style="width:${r/150*100}%;background:${c}"></i><span class="tick" style="left:${100/150*100}%"></span></div>`;
}
function rateCell(rate, inverse){ return `<div class="rate"><span class="num">${pct(rate)}</span>${bar(rate, inverse)}</div>`; }
function input(id, val, opts={}){
  return `<input type="text" inputmode="numeric" class="cell ${opts.cls||""}" id="${id}" data-k="${opts.key||""}" value="${esc(fmtInput(val))}" ${opts.disabled?"disabled":""} aria-label="${esc(opts.label||"")}" placeholder="${esc(opts.ph||"")}">`;

/* ---------- 팀별 지출 계획 (변동비·고정비) ---------- */
const openPlan = {};
const PLAN_DEFAULTS = {
  var: ["외주비","발행비(블로그·프리랜서)","원고비","광고선전비","지급수수료"],
  fix: ["인건비","4대보험(회사분)","퇴직연금","복리후생비","공동경비 배분(임차료 등)"]
};
function planCalc(tg){
  const p=tg.plan; if(!p) return null;
  const rev=Number(tg.rev)||0;
  const v=(p.var||[]).map(x=>({...x, amt: x.rate!=null ? rev*x.rate/100 : null}));
  const f=(p.fix||[]).map(x=>({...x, rate: rev && x.amt!=null ? x.amt/rev*100 : null}));
  const vs=v.reduce((s,x)=>s+(x.amt||0),0), fs=f.reduce((s,x)=>s+(Number(x.amt)||0),0);
  const vr=v.reduce((s,x)=>s+(Number(x.rate)||0),0);
  const active = v.some(x=>x.rate) || f.some(x=>x.amt);
  return {v,f,vs,fs,vr, fr: rev? fs/rev*100 : null, profit: rev-vs-fs, margin: rev? (rev-vs-fs)/rev*100 : null, active, rev};
}
function applyPlan(tg){
  const c=planCalc(tg);
  if(c && c.active){ tg.profit=Math.round(c.profit); delete tg.margin; }
}
const pctTxt = v => v==null||!isFinite(v) ? "–" : (Math.round(v*100)/100)+"%";

function ruleText(rule){
  const w = `종합 달성률 = 매출 달성률 × ${rule.wRev}% + 팀 영업이익 달성률 × ${rule.wProfit}%`;
  let main;

    main = `팀 영업이익 달성률 <b>${rule.gate}% 이상</b>일 때 팀 성과급 = 기본금 <b>${man(rule.base)}</b> + (실제 − 목표 팀 영업이익) × <b>${rule.excessRate}%</b>`;
  } else {
    const t=[...rule.tiers].sort((a,b)=>a.min-b.min).map((x,i,arr)=>{ const n=arr[i+1]; return `${x.min}%${n?"~"+n.min+"% 미만":" 이상"} → ${x.mult}%`; }).join(" · ");
    main = rule.requireBoth
      ? `<b>매출과 팀 영업이익 목표를 모두 100% 이상 달성한 팀만</b> 지급 · 하나라도 미달이면 0원<br>팀 성과급 = 실제 팀 영업이익 × <b>${rule.poolRate}%</b>${rule.tiers.length>2?` × 구간 배수(종합 달성률 기준): ${t}`:""}`
      : `팀 성과급 = 실제 팀 영업이익 × <b>${rule.poolRate}%</b> × 구간 배수<br>구간 배수(종합 달성률 기준): ${t}`;
  }
  const co = rule.coMode==="gate" ? `전사 영업이익(팀 영업이익 합계 − TF팀·경영총괄팀 비용) 달성률 <b>${rule.coGate}% 미만이면 전원 미지급</b>`
    : rule.coMode==="scale" ? `전사 영업이익 달성률이 100% 미만이면 <b>그 비율만큼 전원 성과급 축소</b>`
    : `전사 영업이익 달성률은 지급 조건으로 쓰지 않음`;
  return `${main}<br>${w}<br>팀 상한: 팀 영업이익의 ${rule.capRate}% · 팀 영업이익이 0 이하이면 미지급<br>전사 조건: ${co} · 성과급 총액은 전사 영업이익의 ${rule.coCapRate}% 이내 · 전사 적자면 전원 미지급`;
}

/* 전사 손익 흐름 (팀 영업이익 → 공통비 → 전사 영업이익 → 성과급 → 최종) */
function bridge(co, label){
  const rows=[
    ["4개 팀 영업이익 합계", co.tgTeamP, co.acTeamP, ""],
    ["− TF팀·경영총괄팀 비용", -co.tgCost, -co.acCost, "neg"],
    ["= 전사 영업이익 (성과급 전)", co.coTarget, co.coActual, "sum"],
    ["− 성과급 총액", null, -co.pool, "neg"],
    ["= 성과급 반영 후 전사 영업이익", null, co.after, "sum"]
  ];
  let h=`<div class="tbl-wrap"><table class="bridge"><thead><tr><th class="l">항목</th><th>목표</th><th>${label}</th><th>차이</th></tr></thead><tbody>`;
  rows.forEach(([n,t,a,c])=>{
    h+=`<tr class="${c==="sum"?"bsum":""}"><td class="l">${n}</td><td class="num">${t==null?"–":nf.format(Math.round(t))}</td><td class="num">${a==null?"–":nf.format(Math.round(a))}</td><td class="num">${t==null||a==null?"":sgn(a-t)}</td></tr>`; });
  h+=`</tbody></table></div>`;
  return h;
}

    <p class="small muted" style="margin:0">전사 영업이익이 0 이하이면 어떤 조건이든 성과급을 지급하지 않습니다.</p>

  h+=`<section class="panel"><div class="panel-head"><h2>공통비 부서</h2><span class="small muted">성과급 대상 아님 · 비용만 전사 영업이익에서 차감</span></div>

      h+=`<tr><td>${mi===0?`<input type="text" class="cell name" id="tn-${ti}" data-team="${ti}" value="${esc(t.name)}" ${dis?"disabled":""} aria-label="팀 이름">`:""}</td>
      <td><input type="text" class="cell name" id="mn-${ti}-${mi}" data-mem="${ti}|${mi}|name" value="${esc(m.name)}" ${dis?"disabled":""} aria-label="이름"></td>

/* ---------- excel export ---------- */
const plain = h => String(h).replace(/<br>/g,"\n").replace(/<[^>]+>/g,"");
function hasActuals(p){ const A=p.actuals||{}; return Object.values(A).some(a=>a&&(a.rev!=null||a.profit!=null)); }
function periodData(p){
  const teams=teamsFor(p), ohs=ohsFor(p), rule=ruleFor(p), T=targetsFor(p), C=costsFor(p), confirmed=!!isLocked(p);
  const A=p.actuals||{}, CA=p.costActuals||{}, OR=p.ohRevenue||{};
  const hasAct = hasActuals(p);
  const showAct = confirmed || hasAct;
  const co = showAct? calcCompany(rule,teams,ohs,T,A,C,CA,OR) : simCompany(rule,teams,ohs,T,C,100,100);
  const kind = confirmed? (co.complete? "확정 실적" : "잠정(실적 일부 미입력)") : (hasAct? "실적 · 목표 미확정(성과급 미산정)" : "예상(100% 달성 가정)");
  const payable = confirmed || !hasAct;   // 확정 기간 또는 실적 없는 예상치만 성과급 표기
  return {p,teams,ohs,rule,T,C,A,CA,confirmed,hasAct,showAct,payable,co,kind};
}
const R = (a,b)=> (a!=null && b) ? a/b : null;
const nz = v => v ? v : null;
function summaryRow(d){
  const c=d.co, act=d.showAct;
  const note = d.confirmed? (c.complete? (c.notes.join(" / ")||"") : "실적 일부 미입력 · 잠정치") : (d.hasAct? "목표 미확정 · 성과급 미산정" : "작성 중 · 실적 없음 · 성과급은 100% 달성 가정");
  return [d.p.label, d.confirmed?"확정":(d.hasAct?"실적 입력 · 목표 미확정":"작성 중"), d.confirmed?fmtDate(d.p.confirmed.at):"",
    nz(c.tgRev), act?c.acRev:null, act?R(c.acRev,c.tgRev):null,
    nz(c.tgTeamP), act?c.acTeamP:null, nz(c.tgCost), act?c.acCost:null,
    c.tgRev?c.coTarget:null, act?c.coActual:null, act?R(c.coActual,c.coTarget):null,
    d.payable?Math.round(c.pool):null, d.payable&&act?c.after:(act?c.coActual:null), note];
}

  if(act.startsWith("plan-") && p && p.status!=="confirmed"){
    const tid=b.dataset.t; p.targets=p.targets||{}; const tg=p.targets[tid]=p.targets[tid]||{};
    if(act==="plan-add"){ tg.plan=tg.plan||{var:[],fix:[]}; tg.plan[b.dataset.kind].push(b.dataset.kind==="var"?{name:"",rate:null}:{name:"",amt:null}); }
    if(act==="plan-del"){ tg.plan[b.dataset.kind].splice(+b.dataset.i,1); applyPlan(tg); }
    if(act==="plan-defaults"){ tg.plan={var:PLAN_DEFAULTS.var.map(n=>({name:n,rate:null})), fix:PLAN_DEFAULTS.fix.map(n=>({name:n,amt:null}))}; }
    if(act==="plan-clear"){ delete tg.plan; }
    queueSave(currentId); render(); return;
  }
  if(act==="ask-confirm"){ pendingConfirm="confirm"; render(); return; }
  if(act==="ask-unlock"){ pendingConfirm="unlock"; render(); return; }
  if(act==="ask-delete"){ pendingConfirm="delete"; render(); return; }
  if(act==="cancel-ask"){ pendingConfirm=null; render(); return; }
  if(act==="do-confirm" && p){
    p.status="confirmed";
    p.confirmed={at:new Date().toISOString(), targets:clone(p.targets||{}), costs:clone(p.costs||{}), rule:clone(config.rule), teams:clone(config.teams), overheads:clone(config.overheads)};
    pendingConfirm=null; queueSave(currentId); render(); return;
  }
  if(act==="do-unlock" && p){
    p.targets = clone(p.confirmed?.targets||p.targets||{}); p.costs = clone(p.confirmed?.costs||p.costs||{});
    p.status="draft"; p.lastConfirmed=p.confirmed; delete p.confirmed;
    pendingConfirm=null; queueSave(currentId); render(); return;
  }
  if(act==="do-delete" && p){
    const id=currentId; delete periods[id]; currentId=null; pendingConfirm=null;
    delPeriod(id).then(r=>{ if(r.error){ lastErr="삭제하지 못했습니다."; setSaveState(); } });
    render(); return;
  }
  if(act==="mode"){ config.rule.mode=b.dataset.v; queueSave("config"); render(); return; }
  if(act==="req-both"){ config.rule.requireBoth=!!b.checked; queueSave("config"); render(); return; }
  if(act==="comode"){ config.rule.coMode=b.dataset.v; queueSave("config"); render(); return; }
  if(act==="tier-add"){ const last=config.rule.tiers[config.rule.tiers.length-1]||{min:0,mult:0}; config.rule.tiers.push({min:last.min+10,mult:last.mult+20}); queueSave("config"); render(); return; }
  if(act==="tier-del"){ config.rule.tiers.splice(+b.dataset.i,1); queueSave("config"); render(); return; }
  if(act==="oh-add"){ config.overheads.push({id:"oh"+Date.now().toString(36), name:"새 부서", note:"성과급 제외 · 비용만 반영"}); queueSave("config"); render(); return; }
  if(act==="oh-del"){ config.overheads.splice(+b.dataset.i,1); queueSave("config"); render(); return; }
});

  return { save: async ({filename, data})=>{
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob); const a=document.createElement("a");

}

function subscribe(){
  if(rtChannel) return;
  rtChannel = supa.channel("incentive-sync")
    .on("postgres_changes",{event:"*",schema:"public",table:"periods"}, p=>{
      const id=(p.new&&p.new.id)||(p.old&&p.old.id); if(!id||dirty[id]||writing[id]) return;
      if(p.eventType==="DELETE") delete periods[id]; else periods[id]=normalizePeriod(clone(p.new.data));

    .on("postgres_changes",{event:"*",schema:"public",table:"config"}, p=>{
      if(dirty.config||writing.config||!p.new) return; applyConfig(p.new.data||{}); softRender(); })
    .subscribe();
}
